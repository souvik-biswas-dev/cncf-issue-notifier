name: CNCF issue notifier
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email without scanning issues or changing notification state"
        required: false
        default: false
        type: boolean
concurrency:
  group: notifier
  cancel-in-progress: false
permissions:
  contents: read
  actions: write            # only used by the keep-alive step below
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          package-manager-cache: false
      - name: Restore state
        uses: actions/cache@v6
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: npm ci --no-audit --no-fund
      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version
      - name: Run issue notifier
        run: node src/index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # GitHub switches off scheduled workflows after 60 days without repo activity.
      # Best effort: once a day, re-enable ourselves. If you ever get GitHub's
      # "workflow disabled" e-mail, just press Enable in the Actions tab.
      - name: Keep-alive (daily)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 10 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notify.yml/enable"
          fi
